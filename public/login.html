<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş · Card Dünyası</title>
  <link rel="icon" type="image/png" href="/assets/logo-ball.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F3EDDF;
      --card: #FDFBF3;
      --ink: #17130E;
      --ink-soft: #4A4436;
      --ink-faint: #8A8069;
      --yellow: #F3C532;
      --red: #C24238;
      --red-soft: #F5DCD8;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Archivo', sans-serif;
      background: var(--ink);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image: radial-gradient(rgba(243, 237, 223, 0.05) 1px, transparent 1.4px);
      background-size: 22px 22px;
    }

    .frame {
      width: min(880px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(243, 237, 223, 0.12), 14px 14px 0 rgba(243, 197, 50, 0.16);
      animation: frameIn 0.4s ease both;
    }

    @keyframes frameIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .side {
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 48px 32px;
      position: relative;
      overflow: hidden;
    }

    .side::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(243, 197, 50, 0.1) 1px, transparent 1.6px);
      background-size: 18px 18px;
    }

    .side img {
      width: min(240px, 70%);
      position: relative;
      filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.5));
      animation: logoFloat 5s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .side p {
      position: relative;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(243, 237, 223, 0.55);
    }

    .form-side {
      background: var(--card);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.45rem;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .subtitle {
      color: var(--ink-faint);
      font-size: 0.85rem;
      margin: 8px 0 30px;
    }

    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 7px;
    }

    .field { margin-bottom: 18px; }

    input {
      width: 100%;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: box-shadow 0.12s;
    }

    input:focus { box-shadow: 3px 3px 0 var(--ink); }

    button {
      width: 100%;
      margin-top: 10px;
      background: var(--yellow);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    button:active:not(:disabled) { transform: none; box-shadow: none; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .error {
      display: none;
      margin-bottom: 16px;
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      background: var(--red-soft);
      border: 2px solid var(--red);
      color: var(--red);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .error.visible { display: block; }

    .hint {
      margin-top: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      text-align: center;
    }

    @media (max-width: 700px) {
      .frame { grid-template-columns: 1fr; }
      .side { padding: 34px 24px; gap: 14px; }
      .side img { width: 150px; }
      .form-side { padding: 32px 26px 40px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="side">
      <img src="/assets/logo-transparent.png" alt="Card Dünyası">
      <p>Yönetim Paneli</p>
    </div>

    <div class="form-side">
      <h1>Tekrar hoş geldin</h1>
      <p class="subtitle">Devam etmek için hesabınla giriş yap.</p>

      <div class="error" id="error"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submit-btn">Giriş Yap</button>
      </form>

      <p class="hint">Yalnızca yetkili erişim</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');
    const params = new URLSearchParams(window.location.search);
    const nextPath = params.get('next') || '/';

    async function redirectIfLoggedIn() {
      const response = await fetch('/api/auth/me', { credentials: 'same-origin' });
      if (response.ok) {
        window.location.href = nextPath.startsWith('/') ? nextPath : '/';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value,
          }),
        });

        const payload = await response.json();
        if (!response.ok || !payload.success) {
          throw new Error(payload.error || 'Giriş başarısız.');
        }

        window.location.href = nextPath.startsWith('/') ? nextPath : '/';
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
      }
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
