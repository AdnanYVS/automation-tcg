<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Etiket Yazdır · Card Dünyası</title>
  <link rel="icon" type="image/png" href="/assets/logo-ball.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F3EDDF;
      --card: #FDFBF3;
      --ink: #17130E;
      --ink-faint: #8A8069;
      --yellow: #F3C532;
      --radius-sm: 8px;
      --label-size: 2cm;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Archivo', sans-serif;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(23, 19, 14, 0.055) 1px, transparent 1.4px);
      background-size: 22px 22px;
      color: var(--ink);
      padding: 24px 16px 48px;
    }

    .toolbar {
      max-width: 920px;
      margin: 0 auto 22px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: end;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 6px 6px 0 rgba(23, 19, 14, 0.18);
    }

    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 8px;
      align-self: center;
    }

    .toolbar-brand img { width: 34px; height: 34px; }

    .toolbar-brand span {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .toolbar-hint {
      width: 100%;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 5px;
    }

    input {
      font: inherit;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--ink);
      background: var(--paper);
      width: 110px;
      outline: none;
    }

    button {
      font: inherit;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--ink);
      background: var(--card);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
    button:active { transform: none; box-shadow: none; }
    #print-btn { background: var(--yellow); }

    .back-link {
      margin-left: auto;
      align-self: center;
      color: var(--ink-faint);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .back-link:hover { color: var(--ink); }

    .labels {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .label {
      width: var(--label-size);
      height: var(--label-size);
      background: #fff;
      border: 0.4pt solid #bbb;
      padding: 1.2mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      overflow: hidden;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .label img.qr {
      width: 14mm;
      height: 14mm;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .label .name {
      width: 100%;
      font-size: 5.5pt;
      font-weight: 700;
      line-height: 1.15;
      max-height: 3.8mm;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      color: var(--ink-faint);
      padding: 44px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      width: 100%;
    }

    @media print {
      @page { margin: 4mm; size: auto; }

      body {
        background: #fff;
        padding: 0;
      }

      .toolbar, .no-print { display: none !important; }

      .labels {
        max-width: none;
        gap: 2mm;
      }

      .label {
        width: 2cm;
        height: 2cm;
        border: 0.3pt solid #999;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <div class="toolbar-brand">
      <img src="/assets/logo-ball.png" alt="">
      <span>ETİKET YAZDIR</span>
    </div>
    <div>
      <label for="copies">Basım adedi</label>
      <input id="copies" type="number" min="1" max="99" value="1">
    </div>
    <button type="button" id="render-btn">Etiketleri oluştur</button>
    <button type="button" id="print-btn">Yazdır</button>
    <a href="/" class="back-link">← Panele dön</a>
    <p class="toolbar-hint">2 × 2 cm · yalnızca QR kod ve kart adı</p>
  </div>
  <div id="labels" class="labels">
    <div class="empty">URL'de token veya mappingId parametresi gerekli.</div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const labelsEl = document.getElementById('labels');
    const copiesInput = document.getElementById('copies');
    let labelData = null;

    function getQuery() {
      return new URLSearchParams(window.location.search);
    }

    function qrImageUrl(url) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=${encodeURIComponent(url)}`;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function renderLabels() {
      if (!labelData) return;
      const copies = Math.max(1, Math.min(99, Number(copiesInput.value) || 1));
      const chunks = [];
      for (let i = 0; i < copies; i += 1) {
        chunks.push(`
          <div class="label">
            <img class="qr" src="${qrImageUrl(labelData.qrUrl)}" alt="QR">
            <div class="name">${escapeHtml(labelData.cardName)}</div>
          </div>
        `);
      }
      labelsEl.innerHTML = chunks.join('');
    }

    async function init() {
      await AUTH.requireAuth();
      const query = getQuery();
      const token = query.get('token');
      const mappingId = query.get('mappingId');
      if (!token && !mappingId) return;

      const params = new URLSearchParams();
      if (token) params.set('token', token);
      if (mappingId) params.set('mappingId', mappingId);

      const response = await AUTH.apiFetch(`/api/qr-labels/preview?${params.toString()}`);
      const payload = await response.json();
      if (!response.ok || !payload.success) {
        labelsEl.innerHTML = `<div class="empty">${escapeHtml(payload.error || 'Yüklenemedi')}</div>`;
        return;
      }
      labelData = payload.data;
      const defaultCopies = query.get('copies');
      if (defaultCopies) copiesInput.value = defaultCopies;
      renderLabels();
    }

    document.getElementById('render-btn').addEventListener('click', renderLabels);
    document.getElementById('print-btn').addEventListener('click', () => window.print());

    init();
  </script>
</body>
</html>
